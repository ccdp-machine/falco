<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chromatic Tuner</title>
<style>
  :root {
    --bg: #0d0f14;
    --fg: #f2f4f8;
    --dim: #8a90a0;
    --green: #34c759;
    --orange: #ff9f0a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #mode {
    display: flex;
    background: #161a24;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    overflow: hidden;
  }
  #mode button {
    border: none;
    background: transparent;
    color: var(--dim);
    font: 600 15px/1 inherit;
    font-family: inherit;
    padding: 10px 28px;
  }
  #mode button.active { background: #2a2e3a; color: var(--fg); }
  #note {
    font-size: 96px;
    font-weight: 700;
    line-height: 1.1;
    height: 110px;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  #note.chord { font-size: 64px; }
  #note sub { font-size: 40px; color: var(--dim); font-weight: 600; }
  #gauge { width: 100%; max-width: 420px; }
  #gauge.hidden-soft { visibility: hidden; }
  #freq { font-size: 20px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: center; }
  #cents { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; height: 22px; text-align: center; }
  .in-tune { color: var(--green) !important; }
  .off-tune { color: var(--orange); }
  #calibration {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 17px;
    color: var(--dim);
  }
  #calibration button {
    width: 44px; height: 44px;
    font-size: 24px;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    background: #161a24;
    color: var(--fg);
  }
  #a4 { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 80px; text-align: center; }
  #start {
    position: fixed;
    inset: 0;
    background: var(--bg);
    border: none;
    color: var(--fg);
    font-size: 22px;
    font-weight: 600;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #start .hint { font-size: 15px; font-weight: 400; color: var(--dim); max-width: 280px; }
  #start .big { font-size: 56px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <button id="start">
    <span class="big">&#119070;</span>
    <span>Tap to start tuning</span>
    <span class="hint">Safari will ask for microphone access — the audio never leaves your phone.</span>
  </button>

  <div id="mode">
    <button id="modeTuner" class="active">Tuner</button>
    <button id="modeChord">Chord</button>
  </div>
  <div id="note">&ndash;</div>
  <canvas id="gauge" width="840" height="400"></canvas>
  <div>
    <div id="freq">Listening&hellip;</div>
    <div id="cents">&nbsp;</div>
  </div>
  <div id="calibration">
    <span>A4</span>
    <button id="a4down" aria-label="lower A4">&minus;</button>
    <span id="a4">440 Hz</span>
    <button id="a4up" aria-label="raise A4">+</button>
  </div>

<script src="tuner.js"></script>
<script>
"use strict";

const TUNER_FFT_SIZE = 4096;   // time-domain window for YIN
const CHORD_FFT_SIZE = 16384;  // ~2.9 Hz bins at 48 kHz for chord spectra
const IN_TUNE_CENTS = 5;
let referenceA4 = 440;
let mode = "tuner";
let analyser = null;
let audioCtx = null;

/* --- gauge rendering --- */
const canvas = document.getElementById("gauge");
const ctx = canvas.getContext("2d");
let needleCents = 0;       // animated needle position
let targetCents = null;    // latest reading (null = no signal)

function angleFor(cents) {
  const sweep = (2 * Math.PI) / 3; // 120 degrees total
  return -Math.PI / 2 + (cents / 50) * (sweep / 2);
}

function drawGauge() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h * 0.95;
  const radius = Math.min(w / 2, h) * 0.82;
  ctx.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const green = css.getPropertyValue("--green").trim();
  const orange = css.getPropertyValue("--orange").trim();
  const dim = css.getPropertyValue("--dim").trim();

  // ticks every 10 cents
  for (let t = -5; t <= 5; t++) {
    const a = angleFor(t * 10);
    const major = t === 0 || Math.abs(t) === 5;
    const len = major ? 36 : 20;
    ctx.beginPath();
    ctx.moveTo(cx + (radius - len) * Math.cos(a), cy + (radius - len) * Math.sin(a));
    ctx.lineTo(cx + radius * Math.cos(a), cy + radius * Math.sin(a));
    ctx.strokeStyle = t === 0 ? green : dim;
    ctx.globalAlpha = t === 0 ? 1 : 0.5;
    ctx.lineWidth = major ? 6 : 3;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // in-tune arc
  ctx.beginPath();
  ctx.arc(cx, cy, radius + 12, angleFor(-IN_TUNE_CENTS), angleFor(IN_TUNE_CENTS));
  ctx.strokeStyle = green;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 12;
  ctx.lineCap = "round";
  ctx.stroke();
  ctx.globalAlpha = 1;

  // flat / sharp labels
  ctx.font = "40px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = dim;
  ctx.textAlign = "center";
  ctx.fillText("♭", cx - radius - 34, cy - 10);
  ctx.fillText("♯", cx + radius + 34, cy - 10);

  // needle
  if (targetCents !== null) {
    const a = angleFor(Math.max(-50, Math.min(50, needleCents)));
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + (radius - 48) * Math.cos(a), cy + (radius - 48) * Math.sin(a));
    ctx.strokeStyle = Math.abs(needleCents) <= IN_TUNE_CENTS ? green : orange;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  // hub
  ctx.beginPath();
  ctx.arc(cx, cy, 12, 0, 2 * Math.PI);
  ctx.fillStyle = css.getPropertyValue("--fg").trim();
  ctx.fill();
}

function animate() {
  if (targetCents !== null) {
    needleCents += (targetCents - needleCents) * 0.25; // springy follow
  }
  drawGauge();
  requestAnimationFrame(animate);
}

/* --- displays --- */
const noteEl = document.getElementById("note");
const freqEl = document.getElementById("freq");
const centsEl = document.getElementById("cents");
let smoothedFrequency = null;

function updateTunerDisplay(reading) {
  if (!reading) {
    targetCents = null;
    noteEl.innerHTML = "&ndash;";
    noteEl.classList.remove("in-tune");
    freqEl.textContent = "Listening…";
    centsEl.innerHTML = "&nbsp;";
    return;
  }
  const inTune = Math.abs(reading.cents) <= IN_TUNE_CENTS;
  targetCents = reading.cents;
  noteEl.innerHTML = reading.noteName + "<sub>" + reading.octave + "</sub>";
  noteEl.classList.toggle("in-tune", inTune);
  freqEl.textContent = reading.frequency.toFixed(1) + " Hz";
  centsEl.textContent = (reading.cents >= 0 ? "+" : "") + reading.cents.toFixed(0) + " cents";
  centsEl.className = inTune ? "in-tune" : "off-tune";
}

function updateChordDisplay(chord) {
  if (!chord) {
    noteEl.innerHTML = "&ndash;";
    noteEl.classList.remove("in-tune");
    freqEl.textContent = "Play a chord…";
    centsEl.innerHTML = "&nbsp;";
    return;
  }
  noteEl.textContent = chord.name;
  noteEl.classList.add("in-tune");
  freqEl.textContent = chord.notes.join(" · ");
  centsEl.textContent = chord.score > 0.92 ? "confident" : "probable";
  centsEl.className = "";
  centsEl.style.color = "var(--dim)";
}

/* --- chord stability: show a chord once it wins 2 of the last 3 frames,
       clear only after a few empty frames so strums don't flicker. --- */
const recentChords = [];
let emptyFrames = 0;
let shownChord = null;

function stabilizeChord(chord) {
  if (chord) {
    emptyFrames = 0;
    recentChords.push(chord.name);
    if (recentChords.length > 3) recentChords.shift();
    const wins = recentChords.filter(n => n === chord.name).length;
    if (wins >= 2 || !shownChord) shownChord = chord;
  } else {
    recentChords.length = 0;
    if (++emptyFrames >= 4) shownChord = null;
  }
  return shownChord;
}

/* --- audio --- */
function applyMode() {
  if (!analyser) return;
  analyser.fftSize = mode === "chord" ? CHORD_FFT_SIZE : TUNER_FFT_SIZE;
  smoothedFrequency = null;
  targetCents = null;
  recentChords.length = 0;
  shownChord = null;
}

async function startTuner() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.smoothingTimeConstant = 0.5;
  applyMode();
  source.connect(analyser);

  const timeBuffer = new Float32Array(TUNER_FFT_SIZE);
  const freqBuffer = new Float32Array(CHORD_FFT_SIZE / 2);

  setInterval(() => {
    if (mode === "tuner") {
      analyser.getFloatTimeDomainData(timeBuffer);
      const freq = detectPitch(timeBuffer, audioCtx.sampleRate);
      if (freq === null) {
        smoothedFrequency = null;
        updateTunerDisplay(null);
        return;
      }
      // exponential smoothing; snap on jumps to a different note
      if (smoothedFrequency !== null && Math.abs(1200 * Math.log2(freq / smoothedFrequency)) < 80) {
        smoothedFrequency = smoothedFrequency * 0.7 + freq * 0.3;
      } else {
        smoothedFrequency = freq;
      }
      updateTunerDisplay(makeReading(smoothedFrequency, referenceA4));
    } else {
      const bins = analyser.frequencyBinCount;
      analyser.getFloatFrequencyData(freqBuffer);
      // dB -> linear magnitude
      for (let i = 0; i < bins; i++) {
        freqBuffer[i] = Math.pow(10, freqBuffer[i] / 20);
      }
      const peaks = findSpectralPeaks(freqBuffer.subarray(0, bins), audioCtx.sampleRate, analyser.fftSize);
      updateChordDisplay(stabilizeChord(detectChord(peaks, referenceA4)));
    }
  }, 100);
}

document.getElementById("start").addEventListener("click", async (e) => {
  try {
    await startTuner();
    e.target.classList.add("hidden");
  } catch (err) {
    e.target.querySelector(".hint").textContent =
      "Microphone unavailable: " + err.message + " — check Settings → Safari → Microphone.";
  }
});

for (const [id, m] of [["modeTuner", "tuner"], ["modeChord", "chord"]]) {
  document.getElementById(id).addEventListener("click", () => {
    if (mode === m) return;
    mode = m;
    document.getElementById("modeTuner").classList.toggle("active", m === "tuner");
    document.getElementById("modeChord").classList.toggle("active", m === "chord");
    noteEl.classList.toggle("chord", m === "chord");
    canvas.classList.toggle("hidden-soft", m === "chord");
    centsEl.style.color = "";
    applyMode();
    if (m === "tuner") updateTunerDisplay(null); else updateChordDisplay(null);
  });
}

document.getElementById("a4down").addEventListener("click", () => setA4(referenceA4 - 1));
document.getElementById("a4up").addEventListener("click", () => setA4(referenceA4 + 1));
function setA4(value) {
  referenceA4 = Math.max(415, Math.min(466, value));
  document.getElementById("a4").textContent = referenceA4 + " Hz";
  if (mode === "tuner" && smoothedFrequency !== null) {
    updateTunerDisplay(makeReading(smoothedFrequency, referenceA4));
  }
}

animate();
</script>
</body>
</html>
